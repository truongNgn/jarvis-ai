# Explicit fallback: no GPU device reservation, even when GPU access is unavailable.
services:
  inference:
    gpus: !reset []
    command: ["--model", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--alias", "jarvis-qwen",
              "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "2048", "--parallel", "1",
              "--threads", "4", "--batch-size", "256", "--ubatch-size", "128",
              "--n-gpu-layers", "0", "--jinja"]
