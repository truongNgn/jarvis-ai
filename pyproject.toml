[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "0.1.0"
description = "Local JARVIS model-directed desktop task agent"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1", 
    "pydantic==2.14.1", 
    "langgraph==1.2.15",      
    "fastapi==0.143.0", 
    "uvicorn==0.54.0",
    "langgraph-checkpoint-sqlite"
]

[project.scripts]
jarvis = "jarvis.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.pip]
python-version = "3.12"
python-platform = "x86_64-unknown-linux-gnu"
no-header = true
no-annotate = true
